services:
  kripa:
    build:
      context: .
      args:
        VERSION: ${KRIPA_VERSION:-development}
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      KRIPA_LISTEN_ADDR: 0.0.0.0:8080
      KRIPA_API_TOKEN_FILE: /run/secrets/kripa_api_token
      LOG_LEVEL: info
      KRIPA_CACHE_ENTRIES: "512"
      KRIPA_MAX_INFLIGHT: "32"
    secrets:
      - kripa_api_token
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
secrets:
  kripa_api_token:
    file: ./secrets/kripa_api_token
