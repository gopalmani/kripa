name: Verify KRIPA
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner .
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build pinned Swiss Ephemeris
        run: sh scripts/setup-swiss.sh
      - name: Resolve modules and format candidate
        run: |
          go mod tidy
          gofmt -w cmd internal
          git diff > formatting.patch
      - name: Vet and race tests
        env:
          SWISS_EPHEMERIS_PATH: ${{ github.workspace }}/.deps/swisseph/ephe
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Benchmarks and latency report
        env:
          SWISS_EPHEMERIS_PATH: ${{ github.workspace }}/.deps/swisseph/ephe
        run: |
          go test ./internal/api ./internal/chart ./internal/panchang -run '^$' -bench . -benchmem -count=1 | tee benchmarks.txt
          go run ./cmd/latency -n 200 -c 4 | tee latency-results.json
          GOMAXPROCS=1 go run ./cmd/latency -n 100 -c 1 | tee latency-single-cpu.json
      - name: Validate OpenAPI
        run: |
          python3 -m venv /tmp/schema-check
          /tmp/schema-check/bin/pip install openapi-spec-validator==0.7.2 PyYAML==6.0.3
          /tmp/schema-check/bin/python -m openapi_spec_validator api/openapi.yaml
      - name: Build container
        run: docker build --build-arg VERSION=${{ github.sha }} -t kripa:ci .
      - name: Validate monitoring configuration
        run: |
          docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy:/etc/prometheus:ro" prom/prometheus:v3.14.0 check config --syntax-only /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy:/etc/prometheus:ro" prom/prometheus:v3.14.0 check rules /etc/prometheus/alerts.yml
      - name: Smoke container and graceful shutdown
        run: |
          export KRIPA_API_TOKEN=$(openssl rand -hex 32)
          docker run -d --name kripa-test --read-only --cap-drop ALL --security-opt no-new-privileges -e KRIPA_API_TOKEN -p 127.0.0.1:8080:8080 kripa:ci
          trap 'docker rm -f kripa-test' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health/live; then break; fi
            sleep 1
          done
          /tmp/schema-check/bin/python scripts/smoke.py --schema
          docker stop --time 20 kripa-test
          test "$(docker inspect --format '{{.State.ExitCode}}' kripa-test)" = 0
      - name: Upload validation and formatting artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kripa-validation-${{ matrix.runner }}
          path: |
            formatting.patch
            benchmarks.txt
            latency-results.json
            latency-single-cpu.json
            .deps/ephemeris.sha256
      - name: Export verified ARM64 deployment image
        if: matrix.runner == 'ubuntu-24.04-arm' && github.event_name != 'pull_request'
        run: |
          docker tag kripa:ci kripa:${{ github.sha }}
          docker save kripa:${{ github.sha }} | gzip > kripa-arm64.tar.gz
          sha256sum kripa-arm64.tar.gz > kripa-arm64.tar.gz.sha256
          sh scripts/source-bundle.sh
      - uses: actions/upload-artifact@v4
        if: matrix.runner == 'ubuntu-24.04-arm' && github.event_name != 'pull_request'
        with:
          name: kripa-arm64-image
          path: |
            kripa-arm64.tar.gz
            kripa-arm64.tar.gz.sha256
            bin/kripa-source-*.tar.gz
          retention-days: 14
      - name: Enforce committed formatting and module lock
        run: git diff --exit-code
